<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mate - Contact</title>
        <meta name="description" content="Contact form to request recommendations or ask questions about mate.">
        <meta name="author" content="Jonathan Mazzoli">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="styles/main.css">
        <link rel="stylesheet" href="styles/main-large.css">

        <script src="scripts/app.js" defer></script>
        <script src="scripts/form.js" defer></script>
    </head>
    <body>
        <header class="site-header">
            <div class="wrap nav">
                <a class="logo" href="index.html" aria-label="Mate Home">MATE - The Drink of Uruguay</a>
                <nav aria-label="Primary">
                    <a href="index.html" data-nav="home">Home</a>
                    <a href="varieties.html" data-nav="varieties">Varieties</a>
                    <a href="brew.html" data-nav="brew">Brew Guide</a>
                    <a href="contact.html" data-nav="contact">Contact</a>
                </nav>
            </div>
        </header>

        <main class="wrap">
            <h1>Contact Us</h1>
            <form id="contactForm" class="contact-form" novalidate>
                <fieldset>
                    <legend>Your Info</legend>
                    <label>Full Name
                        <input type="text" name="name" required>
                    </label>
                    <label>Email
                        <input type="email" name="email" required>
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Preferences</legend>
                    <label>Preferred Flavor
                        <select name="prefFlavor">
                            <option value="">Select One</option>
                            <option value="soft">Soft</option>
                            <option value="balanced">Balanced</option>
                            <option value="bitter">Bitter</option>
                        </select>
                    </label>
                    <label>Message
                        <textarea name="message" rows="5" placeholder="Tell us what you like or ask anything..." required></textarea>
                    </label>
                </fieldset>

                <button class="btn" type="submit">Send</button>
                <p id="formMsg" class="result" aria-live="polite"></p>
            </form>
        </main>

        <footer class="site-footer">
            <div class="wrap">
                <small>© <span id="year"></span> Mate Project · <a href="references.html">References</a></small>
            </div>
        </footer>
    </body>
</html>
